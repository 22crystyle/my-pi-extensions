- paragraph:
  - strong: Привет!
  - text: Команда
  - strong: Evrone
  - text: занимается продуктовой разработкой стартапов и помогает развиваться взрослому бизнесу в России, США и Европе.
- paragraph: Мы занимаемся технически сложными, высоконагруженными, наукоёмкими проектами, проектами с большой бизнес логикой или большой серверной инфраструктурой.
- paragraph:
  - text: Сейчас ищем
  - strong: Junior Devops инженера
  - text: для работы на проекте компании, продуктами которой пользуются миллионы людей каждый день (
  - strong: входит в ТОП-3 ИТ-гигантов в РФ).
- paragraph
- paragraph:
  - strong: "Какой опыт и знания для нас являются важными:"
- list:
  - listitem:
    - text: — Опыт работы в качестве
    - strong: Devops инженера на коммерческом проекте от 1 года;
  - listitem: — Kubernetes. Развертывания, эксплуатация, знание его архитектуры и компонентов;
  - listitem: — Git;
- paragraph:
  - strong: "Будет круто, если у вас есть опыт и знания по:"
- list:
  - listitem: — Ansible или Terraform;
  - listitem: — Prometheus / Grafana;
  - listitem: — Администрированию Linux;
  - listitem: — Docker, Docker Compose;
  - listitem: — CI/CD. Любой из популярных, но лучше GitLabCI и GithubActions.
  - listitem: — Helm.
- paragraph:
  - strong: "Что предлагаем:"
- list:
  - listitem:
    - text: —
    - paragraph: Удаленную фултайм работу и гибкий график. Достаточно синхронизировать тайм-зоны и иметь пересечения рабочего времени с командой;
  - listitem:
    - text: —
    - paragraph: При формировании команды проекта учитываем профессиональные или личные интересы разработчиков. По желанию меняем проекты, не даем стагнировать;
  - listitem:
    - text: —
    - paragraph: Работу в разновозрастном, разнополом и потрясающе дружном и профессиональном коллективе;
  - listitem:
    - text: —
    - paragraph: Хорошо организованный воркфлоу, отсутствие бюрократии. Работа на доверии.
- paragraph:
  - strong: Одна из ценностей Evrone – работа с удовольствием.
- paragraph:
  - text: Для этого мы придумали
  - strong: Evrone Benefits.
  - text: Каждому из нас выделяется годовой бюджет, автоматически пополняемый каждый новый год вашей работы в Evrone.
  - strong: "Его можно потратить на полезные категории трат, направленные на:"
- list:
  - listitem:
    - text: —
    - paragraph: ДМС и здоровье;
  - listitem:
    - text: —
    - paragraph: Спорт и абонемент для фитнеса или инвентарь для спорта;
  - listitem:
    - text: —
    - paragraph: Курсы иностранного языка;
  - listitem:
    - text: —
    - paragraph: Техника для работы и улучшение рабочего места;
  - listitem:
    - text: —
    - paragraph: "Обучение: курсы, тренинги, мастер-классы, семинары, книги и конференции."
- paragraph:
  - strong: "Бонусы и премии:"
- list:
  - listitem:
    - text: —
    - paragraph: Повышение зарплаты по мере роста компетенций (по результатам ассессмента Evrone Challenge);
  - listitem:
    - text: —
    - paragraph: Премии за привлечение новых сотрудников и новых клиентов;
  - listitem:
    - text: —
    - paragraph: Дополнительная премия за выступления на конференциях и митапах;
  - listitem:
    - text: —
    - paragraph: У вас есть возможность принять участие в проведении технических интервью специалистов, которые могут стать вашими коллегами. Проведение интервью оплачивается.
- paragraph:
  - strong: "Обучение и рост компетенций:"
- list:
  - listitem:
    - text: —
    - paragraph: Проводим внутренние митапы по Frontend и мобильной разработке;
  - listitem:
    - text: —
    - paragraph: У нас есть культура менторства. В повседневных задачах и планировании карьеры будет помогать наставник;
  - listitem:
    - text: —
    - paragraph: Развивать профессиональный уровень можно с помощью системы ассессмента Evrone Challenge;
  - listitem:
    - text: —
    - paragraph: Есть внутренняя библиотека с электронными книгами и записанными курсами.
  - listitem:
    - text: —
    - paragraph: Мы активно участвуем в жизни коммьюнити и берем интервью у лидеров мнений.
- paragraph:
  - strong: Возможности посещения и участия в мероприятиях
- list:
  - listitem:
    - text: —
    - paragraph: Если вы хотите выступить на конференции, мы поможем вам подготовиться и оплатим все ваши расходы на поездку и участие;
  - listitem:
    - text: —
    - paragraph: Мы также проводим собственные конференции и митапы и любим собираться на них всем нашим дружным коллективом. Разумеется, все расходы на это оплачиваются компанией.
- paragraph:
  - strong: Отдых и развиртуализация
- paragraph: В Evrone есть несколько событий в году, которые собирают вместе весь наш коллектив. Поэтому, где бы вы ни находились, мы будем рады увидеться лично.
